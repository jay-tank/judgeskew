[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "judgeskew"
version = "0.1.0"
description = "Static gate for biased LLM-as-judge evaluation setups. Flags self-preference bias — the same model (or family) used as both the generator and the judge of its own output (JS001) — and weak judge hygiene: no rubric/reference in the prompt, or a nonzero temperature (JS002). AST-based, no target code executed."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jay Tank", email = "tankjai24@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["rich>=13.0"]
keywords = [
    "llm",
    "llm-as-judge",
    "llm-evaluation",
    "evaluation",
    "self-preference-bias",
    "llmops",
    "static-analysis",
    "linter",
    "ci",
    "ast",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
judgeskew = "cli:main"

[project.urls]
Homepage = "https://github.com/jay-tank/judgeskew"
Repository = "https://github.com/jay-tank/judgeskew"
Issues = "https://github.com/jay-tank/judgeskew/issues"

[tool.setuptools]
py-modules = ["cli", "models", "scanner", "render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
